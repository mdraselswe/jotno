<!doctype html>
<html>
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f4f3f0;
      font-family: Arial, Helvetica, sans-serif;
      color: #141414;
    "
  >
    <div style="max-width: 440px; margin: 0 auto; background: #ffffff; border-radius: 16px; padding: 32px">
      <p style="margin: 0 0 4px; font-size: 20px; font-weight: bold">Jotno · যত্ন</p>
      <p style="margin: 0 0 24px; color: #555">Your sign-in code · আপনার সাইন-ইন কোড</p>
      <p style="margin: 0 0 24px; font-size: 36px; font-weight: bold; letter-spacing: 8px">{{ .Token }}</p>
      <p style="margin: 0 0 8px; color: #555; font-size: 14px">
        Type this code on the sign-in page. It works once and expires in 10 minutes.
      </p>
      <p style="margin: 0 0 24px; color: #555; font-size: 14px">
        সাইন-ইন পেজে কোডটা লিখুন। একবারই কাজ করবে, ১০ মিনিট পর মেয়াদ শেষ।
      </p>
      <p style="margin: 0; color: #888; font-size: 12px">
        Didn't ask for this? Ignore this email. · আপনি না চাইলে ইমেইলটা উপেক্ষা করুন।
      </p>
    </div>
  </body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # A local Supabase (Postgres + Auth + Storage) with migrations and demo
      # seed, so the build and e2e tests run against a real database.
      - name: Start Supabase
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,postgres-meta,mailpit
      - name: Write .env.local from the local stack
        run: pnpm db:env
      # The other render mode first (skipped when site.renderLocked), so the
      # configured build is the one e2e tests run against.
      - name: Build (other mode)
        run: pnpm build:other
      - name: Build (configured mode)
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

# Turns on auto-merge for Dependabot patch and minor updates. Majors stay open
# for a person: every merge to main deploys production (Hostinger).
# GitHub merges only after the required "check" job passes (ruleset on main),
# so a breaking update stays open with a red check; the weekly auto-upgrade then
# holds that version and closes the PR (workflows/auto-upgrade.yml).
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
